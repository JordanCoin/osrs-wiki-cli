name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          # Asset names are load-bearing. community-os installs skills by
          # globbing `osrs-wiki-{goos}-{goarch}` off the latest release, so
          # these names must not change — `osrs-wiki-linux-amd64` especially.
          # Pure Go + CGO_ENABLED=0, so every target cross-compiles on this
          # one runner; a job-per-target matrix would only add runner minutes
          # and a race between parallel release uploads.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "==> osrs-wiki-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags="-s -w -X main.version=${TAG_NAME}" \
              -o "osrs-wiki-${goos}-${goarch}" .
          done
          ls -l osrs-wiki-linux-amd64 osrs-wiki-linux-arm64 osrs-wiki-darwin-amd64 osrs-wiki-darwin-arm64
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            osrs-wiki-linux-amd64
            osrs-wiki-linux-arm64
            osrs-wiki-darwin-amd64
            osrs-wiki-darwin-arm64
